<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday Clock-Out Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 30px 15px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
    }

    th,
    td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f0f2f5;
    }

    input[type="time"] {
      padding: 8px;
      font-size: 16px;
      width: 130px;
    }

    .friday {
      background: #f8fbff;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #eef6ff;
      text-align: center;
      display: none;
    }

    .clockout {
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0;
      color: #1d4ed8;
    }

    .details {
      margin-top: 15px;
      line-height: 1.6;
    }

    .day-hours {
      color: #555;
      font-size: 14px;
    }

    .error {
      background: #fff1f1;
      color: #b91c1c;
    }

    @media (max-width: 700px) {
      .container {
        padding: 15px;
      }

      table {
        font-size: 13px;
      }

      th,
      td {
        padding: 6px 3px;
      }

      input[type="time"] {
        width: 100%;
        min-width: 90px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>40 Hour Clock-Out Calculator</h1>

  <p class="subtitle">
    Enter your punches below. All punches are rounded to the nearest 15 minutes.
  </p>

  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>Clock In</th>
        <th>Lunch Start</th>
        <th>Lunch End</th>
        <th>Clock Out</th>
        <th>Hours</th>
      </tr>
    </thead>

    <tbody>

      <tr>
        <td>Monday</td>
        <td><input type="time" id="monIn"></td>
        <td><input type="time" id="monLunchStart"></td>
        <td><input type="time" id="monLunchEnd"></td>
        <td><input type="time" id="monOut"></td>
        <td class="day-hours" id="monHours">--</td>
      </tr>

      <tr>
        <td>Tuesday</td>
        <td><input type="time" id="tueIn"></td>
        <td><input type="time" id="tueLunchStart"></td>
        <td><input type="time" id="tueLunchEnd"></td>
        <td><input type="time" id="tueOut"></td>
        <td class="day-hours" id="tueHours">--</td>
      </tr>

      <tr>
        <td>Wednesday</td>
        <td><input type="time" id="wedIn"></td>
        <td><input type="time" id="wedLunchStart"></td>
        <td><input type="time" id="wedLunchEnd"></td>
        <td><input type="time" id="wedOut"></td>
        <td class="day-hours" id="wedHours">--</td>
      </tr>

      <tr>
        <td>Thursday</td>
        <td><input type="time" id="thuIn"></td>
        <td><input type="time" id="thuLunchStart"></td>
        <td><input type="time" id="thuLunchEnd"></td>
        <td><input type="time" id="thuOut"></td>
        <td class="day-hours" id="thuHours">--</td>
      </tr>

      <tr class="friday">
        <td><strong>Friday</strong></td>
        <td><input type="time" id="friIn"></td>
        <td><input type="time" id="friLunchStart"></td>
        <td><input type="time" id="friLunchEnd"></td>
        <td><strong>Calculated</strong></td>
        <td class="day-hours" id="friHours">--</td>
      </tr>

    </tbody>
  </table>

  <button onclick="calculateClockOut()">
    Calculate Friday Clock-Out
  </button>

  <div class="result" id="result">

    <div>You need to clock out Friday at:</div>

    <div class="clockout" id="clockoutTime">
      --
    </div>

    <div class="details" id="details"></div>

  </div>

</div>


<script>

const days = ["mon", "tue", "wed", "thu"];


/*
----------------------------------
Convert HH:MM to minutes after midnight
----------------------------------
*/
function timeToMinutes(time) {

  if (!time) return null;

  const parts = time.split(":");

  const hours = parseInt(parts[0]);
  const minutes = parseInt(parts[1]);

  return (hours * 60) + minutes;
}


/*
----------------------------------
Round punch to nearest 15 minutes

Examples:
8:07 -> 8:00
8:08 -> 8:15
8:22 -> 8:15
8:23 -> 8:30
----------------------------------
*/
function roundToQuarter(minutes) {

  return Math.round(minutes / 15) * 15;

}


/*
----------------------------------
Format minutes into 12-hour time
----------------------------------
*/
function formatTime(totalMinutes) {

  totalMinutes = totalMinutes % (24 * 60);

  if (totalMinutes < 0) {
    totalMinutes += 24 * 60;
  }

  let hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;

  const period = hours >= 12 ? "PM" : "AM";

  let displayHour = hours % 12;

  if (displayHour === 0) {
    displayHour = 12;
  }

  return (
    displayHour +
    ":" +
    minutes.toString().padStart(2, "0") +
    " " +
    period
  );
}


/*
----------------------------------
Calculate worked minutes for one day
----------------------------------
*/
function calculateDay(prefix) {

  const clockIn =
    timeToMinutes(document.getElementById(prefix + "In").value);

  const lunchStart =
    timeToMinutes(document.getElementById(prefix + "LunchStart").value);

  const lunchEnd =
    timeToMinutes(document.getElementById(prefix + "LunchEnd").value);

  const clockOut =
    timeToMinutes(document.getElementById(prefix + "Out").value);


  if (
    clockIn === null ||
    lunchStart === null ||
    lunchEnd === null ||
    clockOut === null
  ) {
    return null;
  }


  const roundedIn = roundToQuarter(clockIn);
  const roundedLunchStart = roundToQuarter(lunchStart);
  const roundedLunchEnd = roundToQuarter(lunchEnd);
  const roundedOut = roundToQuarter(clockOut);


  const morning =
    roundedLunchStart - roundedIn;

  const afternoon =
    roundedOut - roundedLunchEnd;


  return morning + afternoon;
}


/*
----------------------------------
Main Calculation
----------------------------------
*/
function calculateClockOut() {

  const resultBox = document.getElementById("result");

  resultBox.classList.remove("error");

  let mondayThursdayMinutes = 0;


  /*
  Calculate Monday - Thursday
  */
  for (let day of days) {

    const workedMinutes = calculateDay(day);

    if (workedMinutes === null) {

      showError(
        "Please enter all four punches for Monday through Thursday."
      );

      return;
    }


    if (workedMinutes < 0) {

      showError(
        "One or more Monday–Thursday times appear to be out of order."
      );

      return;
    }


    mondayThursdayMinutes += workedMinutes;

    document.getElementById(day + "Hours").innerText =
      (workedMinutes / 60).toFixed(2);
  }


  /*
  Friday punches
  */
  const friInRaw =
    timeToMinutes(document.getElementById("friIn").value);

  const friLunchStartRaw =
    timeToMinutes(document.getElementById("friLunchStart").value);

  const friLunchEndRaw =
    timeToMinutes(document.getElementById("friLunchEnd").value);


  if (
    friInRaw === null ||
    friLunchStartRaw === null ||
    friLunchEndRaw === null
  ) {

    showError(
      "Please enter Friday's Clock In, Lunch Start, and Lunch End."
    );

    return;
  }


  /*
  Round Friday punches
  */
  const friIn =
    roundToQuarter(friInRaw);

  const friLunchStart =
    roundToQuarter(friLunchStartRaw);

  const friLunchEnd =
    roundToQuarter(friLunchEndRaw);


  /*
  Friday morning worked hours
  */
  const fridayMorning =
    friLunchStart - friIn;


  if (fridayMorning < 0 || friLunchEnd < friLunchStart) {

    showError(
      "Friday's times appear to be out of order."
    );

    return;
  }


  /*
  Total target = 40 hours
  */
  const targetMinutes = 40 * 60;


  /*
  Hours still needed after Friday lunch
  */
  const minutesStillNeeded =
    targetMinutes -
    mondayThursdayMinutes -
    fridayMorning;


  /*
  Calculate required clock-out
  */
  let requiredClockOut =
    friLunchEnd + minutesStillNeeded;


  /*
  Ensure result is on a 15-minute increment
  */
  requiredClockOut =
    Math.ceil(requiredClockOut / 15) * 15;


  /*
  Friday total hours
  */
  const fridayWorked =
    fridayMorning +
    (requiredClockOut - friLunchEnd);


  /*
  Display results
  */
  document.getElementById("friHours").innerText =
    (fridayWorked / 60).toFixed(2);


  document.getElementById("clockoutTime").innerText =
    formatTime(requiredClockOut);


  document.getElementById("details").innerHTML =

    "<strong>Monday–Thursday:</strong> " +
    (mondayThursdayMinutes / 60).toFixed(2) +
    " hours<br>" +

    "<strong>Friday needed:</strong> " +
    (fridayWorked / 60).toFixed(2) +
    " hours<br>" +

    "<strong>Weekly total:</strong> " +
    ((mondayThursdayMinutes + fridayWorked) / 60).toFixed(2) +
    " hours";


  resultBox.style.display = "block";

}


/*
----------------------------------
Display Errors
----------------------------------
*/
function showError(message) {

  const resultBox =
    document.getElementById("result");

  resultBox.style.display = "block";

  resultBox.classList.add("error");

  document.getElementById("clockoutTime").innerText =
    "Error";

  document.getElementById("details").innerText =
    message;

}

</script>

</body>
</html>
